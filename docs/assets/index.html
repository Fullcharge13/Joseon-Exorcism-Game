<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조선퇴마록 에셋 도감</title>
<meta name="description" content="조선퇴마록의 코드로 그린 그림을 종류·이름으로 찾아보는 도감">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 게임과 같은 색(shell.html :root) */
:root{--ink:#15121a;--panel:#211b25;--line:#3b3142;--hanji:#efe6d2;--dim:#a99d8b;--red:#c8402c;--gold:#e0b048;--jade:#3f9a7a;
  --f-disp:"Song Myung","Nanum Myeongjo",serif;--f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--box:96px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--hanji);font:15px/1.5 var(--f-body)}
a{color:var(--gold)}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font:22px var(--f-disp);margin:0 6px 0 0;white-space:nowrap}
h1 small{font:12px var(--f-body);color:var(--dim);margin-left:6px}
#count{color:var(--dim);margin-left:auto;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
input[type=search],select{background:var(--ink);color:var(--hanji);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;min-width:0}
input[type=search]{flex:1 1 180px}
label.tg{display:inline-flex;align-items:center;gap:4px;color:var(--dim);white-space:nowrap}
main{display:flex;gap:16px;padding:12px 16px;align-items:flex-start}
nav{flex:0 0 210px;position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
nav button{display:flex;width:100%;justify-content:space-between;gap:6px;background:none;border:0;color:var(--hanji);font:inherit;padding:4px 8px;border-radius:5px;cursor:pointer;text-align:left}
nav button:hover{background:#2c2431}
nav button.on{background:var(--gold);color:#1a1418}
nav button small{color:inherit;opacity:.7}
nav .sheet{display:block;font-size:12px;padding:0 8px 4px 16px}
#grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--box) + 24px),1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;cursor:pointer;text-align:left;color:inherit;font:inherit;min-width:0}
.card:hover,.card:focus-visible{border-color:var(--gold);outline:none}
.pic{height:var(--box);display:grid;place-items:center;border-radius:4px;overflow:hidden}
.pic img{image-rendering:pixelated;max-width:100%;max-height:100%}
.bg-check .pic,.bg-check .big{background:repeating-conic-gradient(#2a2430 0 25%,#1e1922 0 50%) 0 0/16px 16px}
.bg-dark .pic,.bg-dark .big{background:#0a080c}
.bg-light .pic,.bg-light .big{background:#efe6d2}
.card b{display:block;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#detail{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--hanji);padding:16px;max-width:min(640px,94vw);width:100%}
#detail::backdrop{background:rgba(0,0,0,.6)}
#detail h2{font:22px var(--f-disp);margin:0 0 8px}
.bigs{display:flex;gap:10px;flex-wrap:wrap}
.big{flex:1 1 200px;min-height:200px;display:grid;place-items:center;border-radius:6px;padding:8px}
.big img{image-rendering:pixelated;max-width:100%}
.big p{margin:4px 0 0;font-size:12px;color:var(--dim);text-align:center}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:12px 0 0;font-size:14px}
dt{color:var(--dim)}dd{margin:0;overflow-wrap:anywhere}
#detailClose{float:right;background:none;border:1px solid var(--line);color:var(--hanji);border-radius:6px;padding:2px 10px;font:inherit;cursor:pointer}
.empty{color:var(--dim);padding:24px}
footer{color:var(--dim);font-size:12px;padding:8px 16px 24px}
@media (max-width:760px){
  main{flex-direction:column;padding:10px;align-items:stretch}
  nav{position:static;flex:none;width:100%;max-height:none;display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;padding:4px}
  nav button{width:auto;flex:none;background:#2c2431;white-space:nowrap}
  #grid{width:100%}
  nav .sheet{display:none}
  header{position:static}
}
</style>
</head>
<body class="bg-check">
<header>
  <div class="top"><h1>조선퇴마록 에셋 도감<small id="ver"></small></h1><span id="count"></span></div>
  <div class="tools">
    <input type="search" id="q" placeholder="이름·id 찾기 (예: 도깨비)" aria-label="찾기">
    <select id="kind" aria-label="종류"><option value="">모든 종류</option></select>
    <select id="size" aria-label="크기"><option value="64">작게</option><option value="96" selected>보통</option><option value="144">크게</option></select>
    <select id="bg" aria-label="바탕"><option value="check">체크 바탕</option><option value="dark">어두운 바탕</option><option value="light">밝은 바탕</option></select>
    <label class="tg"><input type="checkbox" id="refine"> 그림 다듬기</label>
  </div>
</header>
<main>
  <nav id="kinds" aria-label="종류"></nav>
  <div id="grid" aria-live="polite"></div>
</main>
<footer>그림은 모두 게임 코드(글자 격자 + 팔레트)로 그린 것을 <code>tools/assets.py</code>가 게임의 그리기 함수로 뽑았습니다. 「그림 다듬기」는 게임 설정의 다듬기(v20.5)를 켠 모습입니다. · <a href="../../">게임 하기</a></footer>
<dialog id="detail" aria-labelledby="dTitle">
  <button id="detailClose" aria-label="닫기">닫기</button>
  <h2 id="dTitle"></h2>
  <div class="bigs" id="dPics"></div>
  <dl id="dInfo"></dl>
</dialog>
<script src="assets.js"></script>
<script>
(() => {
  const D = window.ASSETS || {kinds: [], assets: []},
    $ = s => document.querySelector(s),
    KN = Object.fromEntries(D.kinds.map(k => [k.kind, k.name])),
    esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
  const st = {q: '', kind: '', size: '96', bg: 'check', r: false};
  // 주소에서 상태 읽기(#kind=enemy&q=도깨비&size=144&bg=dark&r=1)
  const readHash = () => {
    const h = new URLSearchParams(location.hash.slice(1));
    st.q = h.get('q') || '';
    st.kind = h.get('kind') || '';
    st.size = ['64', '96', '144'].includes(h.get('size')) ? h.get('size') : '96';
    st.bg = ['check', 'dark', 'light'].includes(h.get('bg')) ? h.get('bg') : 'check';
    st.r = h.get('r') === '1';
  };
  const writeHash = () => {
    const h = new URLSearchParams({kind: st.kind, q: st.q});
    if (st.size !== '96') h.set('size', st.size);
    if (st.bg !== 'check') h.set('bg', st.bg);
    if (st.r) h.set('r', '1');
    history.replaceState(null, '', '#' + h.toString());
  };
  // 종류 고르기 · 왼쪽 목록
  for (const k of D.kinds) if (k.count) $('#kind').insertAdjacentHTML('beforeend', `<option value="${esc(k.kind)}">${esc(k.name)} (${k.count})</option>`);
  const nav = $('#kinds');
  nav.innerHTML =
    `<button data-k=""><span>모든 종류</span><small>${D.assets.length}</small></button>` +
    D.kinds
      .filter(k => k.count)
      .map(k => `<button data-k="${esc(k.kind)}"><span>${esc(k.name)}</span><small>${k.count}</small></button><a class="sheet" href="sheets/${esc(k.kind)}.png" target="_blank" rel="noopener">대표 시트</a>`)
      .join('');
  nav.onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    st.kind = b.dataset.k;
    apply();
  };
  // 칸: 한 번만 만들고 거르기는 hidden으로(빠름)
  const grid = $('#grid'),
    cards = D.assets.map((a, i) => {
      const b = document.createElement('button');
      b.className = 'card';
      b.dataset.i = i;
      b.dataset.name = a.name;
      b.dataset.kind = a.kind;
      b.dataset.hay = (a.name + ' ' + a.id + ' ' + (KN[a.kind] || '') + ' ' + (a.used || '')).toLowerCase();
      b.innerHTML = `<div class="pic"><img alt="" loading="lazy" decoding="async" src="${esc(a.file)}"${a.fileR ? ` data-r="${esc(a.fileR)}"` : ''} data-w="${a.w}" data-h="${a.h}"></div><b>${esc(a.name)}</b><small>${esc(a.id)} · ${a.w}×${a.h}</small>`;
      grid.appendChild(b);
      return b;
    });
  const empty = document.createElement('p');
  empty.className = 'empty';
  empty.textContent = '맞는 그림이 없습니다.';
  empty.hidden = true;
  grid.appendChild(empty);
  // 픽셀이 뭉개지지 않게 정수 배율로 키움(칸 크기 안에서)
  const fit = (img, box) => {
    const w = +img.dataset.w,
      h = +img.dataset.h,
      k = Math.max(1, Math.floor(box / Math.max(w, h)));
    img.style.width = Math.min(w * k, box * 2) + 'px';
  };
  function apply() {
    const q = st.q.trim().toLowerCase();
    let n = 0;
    const box = Math.round(+st.size * (innerWidth < 760 ? 0.75 : 1)); // 휴대폰은 한 줄에 서너 칸
    document.documentElement.style.setProperty('--box', box + 'px');
    document.body.className = 'bg-' + st.bg;
    for (const c of cards) {
      const show = (!st.kind || c.dataset.kind === st.kind) && (!q || c.dataset.hay.includes(q));
      c.hidden = !show;
      if (show) {
        n++;
        const im = c.querySelector('img');
        const src = st.r && im.dataset.r ? im.dataset.r : D.assets[c.dataset.i].file;
        if (im.getAttribute('src') !== src) im.setAttribute('src', src);
        fit(im, box);
      }
    }
    empty.hidden = n > 0;
    $('#count').textContent = n === D.assets.length ? `${n}장` : `${n} / ${D.assets.length}장`;
    $('#q').value = st.q;
    $('#kind').value = st.kind;
    $('#size').value = st.size;
    $('#bg').value = st.bg;
    $('#refine').checked = st.r;
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === st.kind));
    writeHash();
  }
  $('#q').oninput = e => {
    st.q = e.target.value;
    apply();
  };
  $('#kind').onchange = e => {
    st.kind = e.target.value;
    apply();
  };
  $('#size').onchange = e => {
    st.size = e.target.value;
    apply();
  };
  $('#bg').onchange = e => {
    st.bg = e.target.value;
    apply();
  };
  $('#refine').onchange = e => {
    st.r = e.target.checked;
    apply();
  };
  // 크게 보기
  const dlg = $('#detail');
  grid.onclick = e => {
    const c = e.target.closest('.card');
    if (!c) return;
    const a = D.assets[c.dataset.i],
      big = (src, cap) => {
        const k = Math.max(1, Math.floor(240 / Math.max(a.w, a.h)));
        return `<div class="big"><div><img src="${esc(src)}" alt="" style="width:${a.w * k}px"><p>${cap}</p></div></div>`;
      };
    $('#dTitle').textContent = a.name;
    $('#dPics').innerHTML = big(a.file, a.fileR ? '다듬기 끔' : '') + (a.fileR ? big(a.fileR, '다듬기 켬') : '');
    const rows = [
      ['종류', KN[a.kind] || a.kind],
      ['id', a.id],
      ['크기', `${a.w}×${a.h} 픽셀`],
      ['쓰이는 곳', a.used],
      ['처음 보인 판', a.since],
      ['README 그림', (a.readme || []).join(', ')],
      ['파일', `<a href="${esc(a.file)}" target="_blank" rel="noopener">${esc(a.file)}</a>`]
    ];
    $('#dInfo').innerHTML = rows
      .filter(r => r[1])
      .map(([k, v]) => `<dt>${k}</dt><dd>${k === '파일' ? v : esc(v)}</dd>`)
      .join('');
    if (dlg.showModal) dlg.showModal();
    else dlg.setAttribute('open', '');
  };
  $('#detailClose').onclick = () => (dlg.close ? dlg.close() : dlg.removeAttribute('open'));
  dlg.addEventListener('click', e => {
    if (e.target === dlg) $('#detailClose').onclick();
  });
  if (D.version) $('#ver').textContent = D.version;
  readHash();
  apply();
  addEventListener('hashchange', () => {
    readHash();
    apply();
  });
})();
</script>
</body>
</html>
